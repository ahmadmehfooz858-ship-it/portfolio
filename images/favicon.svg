<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Soft inner glow -->
  <rect x="6" y="6" width="52" height="52" rx="11" ry="11" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Letter A -->
  <text x="32" y="46" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="38" fill="url(#letter)" letter-spacing="-1">A</text>
</svg>
